<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Редактирование задачи</title>
    <link th:href="@{/webjars/bootstrap/5.3.0/css/bootstrap.min.css}" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow-sm p-4 mx-auto" style="max-width: 600px;">
        <h2 class="mb-4">Редактировать задачу</h2>
        <form th:action="@{/dashboard/edit/{id}(id=${task.id})}" method="post">
            <div class="mb-3">
                <label class="form-label">Название:</label>
                <input type="text" name="title" class="form-control" th:value="${task.title}" required>
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Уровень:</label>
                <input type="number" name="level" class="form-control" th:value="${task.level}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Тема:</label>
                <input type="text" name="topic" class="form-control" th:value="${task.topic}">
            </div>
            <div class="mb-3">
                <label class="form-label">Сложность:</label>
                <select name="difficulty" class="form-select">
                    <option th:each="diff : ${T(com.example.demo.Entity.Difficulty).values()}"
                            th:value="${diff}"
                            th:text="${diff}"
                            th:selected="${diff.name() == task.difficulty}">
                    </option>
                </select>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">Сохранить изменения</button>
                <a href="/dashboard" class="btn btn-outline-secondary">Отмена</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>

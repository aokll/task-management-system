<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Регистрация</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net">
</head>
<body class="container mt-5">
<div class="row justify-content-center">
  <div class="col-md-4">
    <h2 class="text-center">Создать аккаунт</h2>

    <!-- Форма отправляет POST на /register -->
    <form th:action="@{/register}" method="post" class="card p-4 shadow">
      <p th:if="${error}" th:text="${error}" style="color: red;"></p>
      <div class="mb-3">
        <label class="form-label">Логин:</label>
        <!-- Имя 'username' должно совпадать с @RequestParam в контроллере -->
        <input type="text" name="username" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Пароль:</label>
        <!-- Имя 'password' должно совпадать с @RequestParam в контроллере -->
        <input type="password" name="password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-success w-100">Зарегистрироваться</button>
    </form>

    <p class="mt-3 text-center">
      <a href="/login">Уже есть аккаунт? Войти</a>
    </p>
  </div>
</div>
</body>
</html>

spring:
 datasource:
   url: jdbc:postgresql://localhost:5432/javarush_tracker
   username: postgres
   password: 1111
   driver-class-name: org.postgresql.Driver
 flyway:
   enabled: true
   baseline-on-migrate: true
   baseline-version: 0
   locations: classpath:db/migration
   out-of-order: true
 jpa:
   hibernate:
     ddl-auto: validate
   show-sql: true
   properties:
     hibernate:
       format_sql: true
       dialect: org.hibernate.dialect.PostgreSQLDialect
